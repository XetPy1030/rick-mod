plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	// Polymer: ресурспак и его раздача через порт игры (docs/architecture/content-delivery.md)
	maven { url = 'https://maven.nucleoid.xyz' }
	// Simple Voice Chat API: голос персонажей (docs/design/voice.md)
	maven { url = 'https://maven.maxhenkel.de/repository/public' }
}

loom {
	// Доступ к полям Minecraft: rikoshet.classtweaker
	accessWidenerPath = file('src/main/resources/rikoshet.classtweaker')

	// Мод серверный: клиентский запуск не нужен
	runs {
		remove client
		server {
			runDir 'run'
			// Кастинг и ИИ-клиент читают ключ из окружения; сюда ключ не пишем
			environmentVariable 'OPENROUTER_API_KEY', System.getenv('OPENROUTER_API_KEY') ?: ''
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// SQLite — внутрь jar мода (jar-in-jar)
	implementation "org.xerial:sqlite-jdbc:${project.sqlite_jdbc_version}"
	include "org.xerial:sqlite-jdbc:${project.sqlite_jdbc_version}"

	// Polymer: только ресурспак и autohost — предметов и блоков на этапе 3 нет, polymer-core не нужен
	implementation "eu.pb4:polymer-resource-pack:${project.polymer_version}"
	implementation "eu.pb4:polymer-autohost:${project.polymer_version}"
	include "eu.pb4:polymer-common:${project.polymer_version}"
	include "eu.pb4:polymer-resource-pack:${project.polymer_version}"
	include "eu.pb4:polymer-autohost:${project.polymer_version}"

	// Голосовой чат — только при компиляции: мод стоит на сервере, без него голос молча выключен
	compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

jar {
	def projectName = project.name
	inputs.property 'projectName', projectName
}
